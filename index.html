<body>
  <div id="app"><div id="boot">Ironband 加载中…</div></div>
  <!-- 全局错误捕获: 即使模块解析/加载失败也显示文字, 避免纯黑屏 (真机定位用) -->
  <script>
    // iOS Safari 双击缩放兜底拦截 (touch-action 之外再加一层): 350ms 内第二次触摸即阻止默认缩放。
    (function () {
      function lockViewport() {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || document.documentElement.clientHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        window.scrollTo(0, 0);
      }
      lockViewport();
      window.addEventListener('resize', lockViewport, { passive: true });
      window.addEventListener('orientationchange', function () { setTimeout(lockViewport, 80); }, { passive: true });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', lockViewport, { passive: true });
      var last = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - last <= 350) e.preventDefault();
        last = now;
        setTimeout(lockViewport, 0);
      }, { passive: false });
      // 阻止双指/手势缩放
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    })();
    (function () {
      function show(msg) {
        var d = document.getElementById('booterr');
        if (!d) { d = document.createElement('div'); d.id = 'booterr';
          d.style.cssText = 'position:fixed;inset:0;padding:18px;color:#ffd27a;background:#120a0a;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99999';
          document.body.appendChild(d); }
        d.textContent = 'Ironband 启动信息:\n' + msg;
      }
      // capture=true 以捕获资源(脚本/样式)加载失败 (不冒泡)
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.src || t.href)) { show('资源加载失败 (可能是缓存/路径):\n' + (t.src || t.href)); return; }
        show((e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; show('unhandledrejection:\n' + ((r && (r.stack || r.message)) || String(r)));
      });
    })();
  </script>
