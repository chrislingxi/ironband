<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; background: #080709; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080709; }
    body { position: fixed; inset: 0; font-family: Georgia, "Times New Roman", serif; touch-action: none; }
    #game-shell { position: absolute; inset: 0; overflow: hidden; background: #080709; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #080709; outline: 0; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #080709; transition: opacity .35s ease; z-index: 4; }
    #loading.is-hidden { opacity: 0; pointer-events: none; }
    .sigil { width: min(17vw, 88px); aspect-ratio: 1; border: 1px solid #a8844c; transform: rotate(45deg); box-shadow: 0 0 42px #b65d2540, inset 0 0 20px #080709; animation: pulse 1.5s ease-in-out infinite; }
    .sigil::after { content: "III"; display: grid; place-items: center; width: 100%; height: 100%; color: #e4c78d; font-size: 24px; transform: rotate(-45deg); }
    #progress-track { position: absolute; top: calc(50% + 76px); width: min(46vw, 280px); height: 2px; background: #3c3024; }
    #progress { width: 0; height: 100%; background: #d6a555; box-shadow: 0 0 10px #d6a555; transition: width .15s linear; }
    #fullscreen { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 66px); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0; border: 1px solid #9f7a45; border-radius: 6px; color: #f0d8a8; background: #100d10cc; z-index: 3; cursor: pointer; }
    #fullscreen svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    #rotate { display: none; position: absolute; inset: 0; z-index: 8; place-items: center; background: radial-gradient(circle, #20151a 0, #080709 68%); color: #e8d2a4; text-align: center; }
    #rotate-mark { width: 72px; height: 112px; border: 2px solid #b38b50; border-radius: 10px; transform: rotate(90deg); box-shadow: 0 0 26px #a84d2938; }
    #rotate-mark::after { content: ""; display: block; width: 24px; height: 3px; margin: 8px auto; background: #b38b50; }
    #error { display: none; position: absolute; inset: 0; z-index: 9; place-items: center; padding: 30px; color: #e8d2a4; background: #080709; text-align: center; line-height: 1.6; }
    @keyframes pulse { 50% { opacity: .48; box-shadow: 0 0 68px #c56a3855, inset 0 0 28px #080709; } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: grid; } }
    @media (display-mode: fullscreen), (display-mode: standalone) { #fullscreen { display: none; } }
  </style>
</head>
<body>
  <main id="game-shell">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" aria-label="loading"><div class="sigil"></div><div id="progress-track"><div id="progress"></div></div></div>
    <button id="fullscreen" type="button" aria-label="全屏" title="全屏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
    <div id="rotate" aria-hidden="true"><div id="rotate-mark"></div></div>
    <div id="error"></div>
  </main>
  <script>
    const shell = document.querySelector('#game-shell');
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#progress');
    const error = document.querySelector('#error');
    const fullscreen = document.querySelector('#fullscreen');
    const buildUrl = 'Build';
    const config = {
      arguments: [],
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
      workerUrl: buildUrl + '/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    let unityInstance;
    const loader = document.createElement('script');
    loader.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, value => {
      progress.style.width = `${Math.round(value * 100)}%`;
    }).then(instance => {
      unityInstance = instance;
      loading.classList.add('is-hidden');
      setTimeout(() => loading.remove(), 400);
    }).catch(message => {
      error.textContent = String(message);
      error.style.display = 'grid';
    });
    loader.onerror = () => {
      error.textContent = '游戏资源加载失败，请刷新后重试。';
      error.style.display = 'grid';
    };
    document.body.appendChild(loader);

    fullscreen.addEventListener('click', async () => {
      if (unityInstance?.SetFullscreen && !document.fullscreenElement) unityInstance.SetFullscreen(1);
      else if (shell.requestFullscreen) await shell.requestFullscreen().catch(() => {});
    });

    window.addEventListener('resize', () => window.scrollTo(0, 0));
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
